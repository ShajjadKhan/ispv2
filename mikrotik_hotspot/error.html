<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberNet | Hotspot Alert</title>
<style>
body { background: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
.card { background: rgba(15,23,42,0.95); border: 1px solid rgba(239,68,68,0.3); border-radius: 24px; padding: 28px 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.btn { display: block; width: 100%; background: #38bdf8; color: #0b1120; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; margin-top: 18px; box-sizing: border-box; }
.btn:hover { background: #0ea5e9; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size: 36px; margin-bottom: 10px;">⚠️</div>
  <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 800; color: #ef4444;">Access Notice</h2>
  <p style="color: #f8fafc; font-size: 13px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); padding: 12px; border-radius: 10px; margin: 15px 0;">$(error)</p>
  <a href="$(link-login)" class="btn">Return to Login</a>
</div>
</body>
</html>
