<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberNet | Logged Out</title>
<style>
body { background: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
.card { background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 28px 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.btn-login { display: block; width: 100%; background: #3b82f6; color: #fff; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; margin-top: 18px; box-sizing: border-box; }
.btn-login:hover { background: #2563eb; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size: 36px; margin-bottom: 10px;">🔒</div>
  <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 800;">Session Disconnected</h2>
  <p style="color: #94a3b8; font-size: 13px; margin: 0 0 15px 0;">You have successfully logged out from CyberNet Wi-Fi.</p>
  <a href="$(link-login)" class="btn-login">Log In Again</a>
</div>
</body>
</html>
