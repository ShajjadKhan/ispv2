<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberNet | Connection Status</title>
<style>
body { background: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
.card { background: rgba(15,23,42,0.95); border: 1px solid rgba(56,189,248,0.3); border-radius: 24px; padding: 24px 20px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(16,185,129,0.15); color: #10b981; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; letter-spacing: 0.05em; }
.metric-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
.metric-label { color: #94a3b8; }
.metric-val { font-weight: 700; font-family: monospace; color: #38bdf8; }
.btn-logout { display: block; width: 100%; background: #ef4444; color: #fff; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 18px; }
.btn-logout:hover { background: #dc2626; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size: 32px; margin-bottom: 8px;">🌐</div>
  <h2 style="margin: 0 0 6px 0; font-size: 18px; font-weight: 800;">CyberNet High-Speed Wi-Fi</h2>
  <div class="badge">● CONNECTED &amp; ACTIVE</div>
  
  <div style="margin-top: 20px; text-align: left;">
    <div class="metric-row"><span class="metric-label">Assigned IP</span><span class="metric-val">$(ip)</span></div>
    <div class="metric-row"><span class="metric-label">Device MAC</span><span class="metric-val">$(mac)</span></div>
    <div class="metric-row"><span class="metric-label">Session Uptime</span><span class="metric-val">$(uptime)</span></div>
    <div class="metric-row"><span class="metric-label">Downloaded</span><span class="metric-val">$(bytes-out-nice)</span></div>
    <div class="metric-row"><span class="metric-label">Uploaded</span><span class="metric-val">$(bytes-in-nice)</span></div>
    $(if session-time-left)<div class="metric-row"><span class="metric-label">Time Remaining</span><span class="metric-val">$(session-time-left)</span></div>$(endif)
  </div>

  <form action="$(link-logout)" name="logout" method="post">
    <button type="submit" class="btn-logout">Disconnect / Log Out</button>
  </form>
</div>
</body>
</html>
